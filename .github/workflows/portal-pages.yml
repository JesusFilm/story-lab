name: Deploy Story Lab Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: story-lab-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            projects/portal/package-lock.json
            prototypes/sermon-in-the-crowd/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: projects/portal
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: prototypes/sermon-in-the-crowd
      - run: npm run build && npm test
        working-directory: projects/portal
      - uses: actions/upload-pages-artifact@v3
        with:
          path: projects/portal/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
