name: Shepherd Adventure smoke test
on:
  pull_request:
    paths:
      - prototypes/shepherd-adventure/**
      - projects/portal/build.py
      - projects/portal/publication.json
      - projects/portal/shepherd-adventure-smoke.mjs
      - projects/portal/package.json
      - projects/portal/package-lock.json
      - .github/workflows/shepherd-adventure-smoke.yml
      - .github/workflows/portal-pages.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            projects/portal/package-lock.json
            prototypes/sermon-in-the-crowd/package-lock.json
            prototypes/little-light-library/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: projects/portal
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: prototypes/sermon-in-the-crowd
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: prototypes/little-light-library
      - run: npm run build
        working-directory: projects/portal
      - name: Smoke test Shepherd Adventure
        run: npm run test:shepherd-adventure
        working-directory: projects/portal
      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shepherd-adventure-smoke-failure
          path: projects/portal/test-results/
          if-no-files-found: ignore
