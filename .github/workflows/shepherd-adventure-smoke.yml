name: Shepherd Adventure smoke test
on:
  pull_request:
    paths:
      - prototypes/shepherd-adventure/**
      - projects/portal/build.py
      - projects/portal/publication_utils.py
      - projects/portal/verify.py
      - projects/portal/publication.json
      - projects/portal/shepherd-adventure-smoke.mjs
      - projects/portal/playwright.mobile.config.mjs
      - projects/portal/mobile-tests/**
      - projects/portal/startup-tests/**
      - projects/portal/tests/**
      - projects/portal/playwright.startup.config.mjs
      - projects/portal/serve.py
      - projects/portal/package.json
      - projects/portal/package-lock.json
      - .github/workflows/shepherd-adventure-smoke.yml
      - .github/workflows/portal-pages.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target: [android-portrait-dpr3, android-landscape-dpr4, webkit-iphone]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            projects/portal/package-lock.json
            prototypes/sermon-in-the-crowd/package-lock.json
            prototypes/little-light-library/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: projects/portal
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: prototypes/sermon-in-the-crowd
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: prototypes/little-light-library
      - run: npm run build && npm test && npm run test:unit && npm run check:publication
        working-directory: projects/portal
      - name: Install pinned mobile test browsers
        run: npx playwright install --with-deps chromium webkit
        working-directory: projects/portal
      - name: Smoke test Shepherd Adventure
        if: matrix.target == 'android-portrait-dpr3'
        run: npm run test:shepherd-adventure
        working-directory: projects/portal
      - name: Mobile rendering and touch regression tests
        run: npm run test:mobile -- --project=${{ matrix.target }}
        working-directory: projects/portal
      - name: Constrained startup and quality regression
        if: matrix.target == 'android-portrait-dpr3'
        run: npm run test:startup
        working-directory: projects/portal
      - name: Upload mobile screenshots, traces and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shepherd-adventure-${{ matrix.target }}
          path: |
            projects/portal/test-results/
            projects/portal/playwright-report/
          retention-days: 14
          if-no-files-found: ignore
